org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
# Java 17 required for MC 1.20.1
#org.gradle.java.home=C:/Program Files/Java/jdk-17
minecraft_version=1.20.1
# 47.4.10: the higher of the two declared floors — Iron's Spellbooks 3.16.x needs
# 47.4.x, Ars Zero 2.0.2 declares [47.4.10,). This is the dev toolchain only; the
# shipped mods.toml forge range stays [47,).
forge_version=47.4.10
mod_id=ars_n_spells
mod_name=Ars 'n' Spells
mod_version=3.3.5
mod_group=com.otectus.arsnspells
mod_authors=otectus
mod_license=GNU GPLv3

# CurseForge Dependencies (1.20.1 Versions)
# Format: curse.maven:<slug>-<projectId>:<fileId>
ars_nouveau_project=ars-nouveau-401955
# 6688854 = Ars Nouveau 4.12.7 (4781441 was 4.5.0 — the compile classpath
# silently disagreed with the mods.toml requirement [4.12.7,4.13))
ars_nouveau_file=6688854
irons_spellbooks_project=irons-spells-n-spellbooks-855414
# 7402504 = Iron's 1.20.1-3.15.0, the compile pin (read from the jar's mods.toml).
irons_spellbooks_file=7402504
# -PwithIrons316RuntimeGameTests runs the Iron's-loaded GameTests against 1.20.1-3.16.3
# (file 8680180) instead, the release current packs ship. 3.16.x needs irons_lib 2.x and
# GeckoLib 4.8.2+ at runtime; ANS still compiles against the 3.15.0 pin.
irons_spellbooks_316_file=8680180
irons_lib_version=1.20.1-2.1.0
geckolib_316_version=4.8.3

# Curios API (compile-only; bundled at runtime via Ars Nouveau). Match Ars' runtime version.
# 5.14.1 is the floor Ars Zero 2.0.2 and Covenant of the Seven 2.2.6 both declare.
curios_version=5.14.1+1.20.1

# Runtime-only libraries so runClient/runGameTestServer can actually boot:
# Ars needs GeckoLib + Curios; Iron's (under -PwithIronsRuntimeGameTests) also
# needs PlayerAnimator. None of these are compile-time APIs for this mod.
geckolib_version=4.7.1.3
playeranimator_version=1.0.2-rc1+1.20

# JEI (compile-only, client-only integration). Version matches the one in the 3.0.3 crash
# report's pack. Only the API artifacts are needed — ANS never requires JEI at runtime.
jei_version=15.49.0.187

# Optional Ars Nouveau addon test profiles (runtime-only, opt-in — see build.gradle).
# ANS never compiles against these; the profiles exist so the school-resolution and
# round-trip GameTests can run against real addon glyphs instead of synthetic ones.
# Ars Elemental 0.6.8.0 is the version named in the audit brief and present in the
# 3.0.3 crash report's pack.
ars_elemental_project=ars-elemental-561470
ars_elemental_file=8399870
toomanyglyphs_project=too-many-glyphs-560595
toomanyglyphs_file=4813803
# Ars Zero 2.0.2 has no CurseForge listing we can resolve offline, so -PwithArsZero
# reads the jar out of the git-ignored libs/ directory instead (see build.gradle).
# TerraBlender is Ars Zero's runtime dependency; 1.20.1-3.0.1.10 is its declared floor
# and is served by the Forge maven.
terrablender_version=1.20.1-3.0.1.10
