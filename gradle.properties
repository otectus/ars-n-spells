# Gradle
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=false
# org.gradle.java.home is intentionally unset. Gradle itself runs on whatever JAVA_HOME
# provides (17..21 is fine for Gradle 8.12); the mod's compile/run toolchain is Java 21 and
# is provisioned by the foojay resolver declared in settings.gradle.

# Minecraft + NeoForge (1.21.1 line)
minecraft_version=1.21.1
# Bounded to 1.21.1 on purpose: DataComponents, the payload codecs and the mojmap mixin
# targets are all 1.21.1-specific, and this build genuinely cannot run on 1.21.2+.
minecraft_version_range=[1.21.1,1.21.2)
# 21.1.248 rather than the 21.1.228 Ars Nouveau itself builds against: NeoForge keeps binary
# compatibility within the 21.1 line, 248 is the latest stable, and it is what the sibling
# 1.21.1 ports (MCAQuests, sophisticated-tab) already pin.
neoforge_version=21.1.248
neoforge_version_range=[21.1.0,21.2)
loader_version_range=[4,)

# Parchment parameter names
parchment_mc_version=1.21.1
parchment_version=2024.11.17

# Mod
mod_id=ars_n_spells
mod_name=Ars 'n' Spells
mod_license=GNU GPLv3
mod_version=3.2.0
mod_group_id=com.otectus.arsnspells
mod_authors=otectus
mod_description=Bridges Ars Nouveau and Iron's Spells 'n Spellbooks into one magic system. Five mana-unification modes decide which pool your spells actually draw from, with configurable conversion rates and dual-cost splits. Spell power scales across both mods through school affinity that grows as you cast, cross-mod progression bonuses, and a resonance multiplier tied to how full your pool is. Cooldowns are unified per spell category across both mods. Four rituals - Spell Transcription, Spellbook Binding, Mana Infusion and Mana Well - plus the Spell Loom workstation let you inscribe an Ars Nouveau spell onto an Iron's scroll and bind it into an Iron's spellbook, where it appears in the native spell wheel and casts like any other spell. Iron's Spellbooks is optional; with it absent the mod runs as an Ars Nouveau addon.

## Dependencies
# Ars Nouveau — HARD dependency, resolved from the official BlameJared maven rather than
# CurseMaven. The real maven carries a POM declaring Ars' own runtime graph (GeckoLib 4.6.6,
# Curios 9.3.1+1.21.1, Nuggets, Patchouli, JEI, TerraBlender), so `runClient` boots a genuine
# Ars install without hand-pinned runtimeOnly entries. NeoForge jars are mojmap; there is no
# deobf pipeline and none is needed.
ars_nouveau_version=5.13.1.1400
# Ars Nouveau runtime range. Deliberately floored at the 5.13 line we compile against: the
# 1.20.1 build shipped a mods.toml range that silently disagreed with the compile classpath
# (see CHANGELOG 3.0.0), and that must not repeat.
ars_nouveau_version_range=[5.13,6.0)

# Iron's Spells 'n Spellbooks — OPTIONAL dependency, compileOnly. Resolved from Redspace's own
# maven. The plain (classifier-less) artifact is used, not `:api`: this mod reaches into
# gui.inscription_table, gui.overlays, jei.* and registries.*, which the api jar does not expose.
irons_spellbooks_version=1.21.1-3.16.3
# Floor raised from 3.15.0 to the version this build is actually tested against. This mod
# mixins into Iron's non-API internals (gui.inscription_table.*, item.Scroll, MagicData's
# private serverPlayer field), and every injection uses require = 0 - so on an untested
# release the affected features go silently inert rather than failing loudly. Declaring a
# range wider than what was verified turned that into an unbounded promise. MixinSelfCheck
# reports drift at startup for anything inside the range that still moves.
irons_spellbooks_version_range=[1.21.1-3.16.3,1.21.1-4.0.0)

# Curios API — compileOnly. Curios is always present at runtime (Ars Nouveau hard-depends on it
# and pulls it transitively); this only puts the slot-aware API on the compile classpath so
# EquipmentIntegration can read per-curio attribute modifiers. Version matches Ars' own pin.
curios_version=9.3.1+1.21.1

# JEI — compileOnly API only, for the client-side proxy-recipe filter. ANS never requires JEI:
# the plugin class is @JeiPlugin and is simply never loaded when JEI is absent.
jei_version=19.44.0.403

## Optional Ars Nouveau addon test profile (runtime-only, opt-in — see build.gradle).
# Ars Elemental 0.7.10.1 for 1.21.1. ANS never compiles against it; the profile exists so the
# school-resolution and round-trip GameTests can run against real addon glyphs.
#   ./gradlew runGameTestServer -PwithArsElemental
ars_elemental_project=561470
ars_elemental_file=8399862
# Too Many Glyphs has NO 1.21.1 build (project 560595 is 1.20.1/Forge only, abandoned since
# Oct 2023). The 1.20.1 `-PwithTooManyGlyphs` profile therefore has no counterpart here.
