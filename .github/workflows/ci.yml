name: CI

on:
  pull_request:
    branches: [main, "release/**", "port/neoforge-1.21.1", "codex/3.3.0-neoforge-audit"]
  push:
    branches: [main, "release/**", "port/neoforge-1.21.1", "codex/3.3.0-neoforge-audit"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: neoforge-${{ runner.os }}-${{ hashFiles('**/*.gradle', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
      - run: chmod +x ./gradlew
      - name: Verify tooling and icon assets
        run: |
          python3 -m unittest discover -s tools -p "test_*.py"
          python3 tools/generate_icons.py --check
          python3 tools/verify_icons.py
      - name: Verify shared domain and golden fixture manifest
        run: python3 tools/contract_parity.py

      - run: ./gradlew compileJava test --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neo-unit-results
          path: |
            build/reports/tests/test
            build/test-results/test

  gametest:
    name: NeoForge GameTests (${{ matrix.profile }})
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: absent
            flags: ""
            executed: 1
            skipped: 66
            identity: "--absent irons_spellbooks --absent ars_elemental --absent ars_zero --absent ars_elemancy"
          - profile: loaded
            flags: "-PwithIronsRuntimeGameTests -PwithArsElemental -PwithArsZero -PwithArsElemancy"
            executed: 67
            skipped: 0
            identity: "--present irons_spellbooks --present ars_elemental --present ars_zero --present ars_elemancy"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: neoforge-${{ runner.os }}-${{ hashFiles('**/*.gradle', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
      - run: chmod +x ./gradlew
      - name: Run isolated profile
        run: ./gradlew runGameTestServer -PgametestRunDir=run-${{ matrix.profile }} ${{ matrix.flags }} --no-daemon --stacktrace
      - name: Verify completed tests and actual runtime profile
        run: >
          python3 tools/verify_gametest_log.py run-${{ matrix.profile }}/logs/latest.log
          --required 104 --executed ${{ matrix.executed }} --skipped ${{ matrix.skipped }} ${{ matrix.identity }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neo-gametest-${{ matrix.profile }}
          path: run-${{ matrix.profile }}/logs
