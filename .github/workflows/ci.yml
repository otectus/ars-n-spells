name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Minecraft 1.20.5+ requires Java 21. Gradle itself also runs on it here; the
      # foojay resolver in settings.gradle would provision a toolchain if it did not.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # ModDevGradle decompiles and patches Minecraft into ~/.gradle/caches/neoformruntime.
      # It is slow (minutes) and keyed only on the NeoForge version, so cache it separately
      # from the dependency cache above. Replaces the 1.20.1 ForgeGradle cache step.
      - name: Cache NeoForm runtime
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/neoformruntime
          key: neoformruntime-${{ runner.os }}-${{ hashFiles('gradle.properties') }}
          restore-keys: |
            neoformruntime-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Compile
        run: ./gradlew compileJava --no-daemon --stacktrace

      - name: Test
        run: ./gradlew test --no-daemon --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            build/reports/tests/test
            build/test-results/test

  # GameTests run as a separate job because they are slower and need the full ModDevGradle
  # environment. This job runs the Iron's-LESS profile (Iron's is compileOnly, so it is absent
  # from the run classpath) and is BLOCKING (audit E7): it proves the dedicated-server fallback
  # path boots and all required GameTests pass without Iron's installed. The Iron's-loaded
  # profile (-PwithIronsRuntimeGameTests) remains a local/manual run because it needs the
  # upstream runtime jars.
  gametest:
    name: GameTest server (Iron's-less)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}

      - name: Cache NeoForm runtime
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/neoformruntime
          key: neoformruntime-${{ runner.os }}-${{ hashFiles('gradle.properties') }}

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run GameTest server
        run: ./gradlew runGameTestServer --no-daemon --stacktrace

      # runGameTestServer exits 0 / BUILD SUCCESSFUL even when the server crashes at boot or
      # when zero tests were collected, so the gradle exit code alone proves nothing — the log
      # line "All N required tests passed" is the real success signal. The second grep is new:
      # an empty namespace makes vanilla throw "No test functions were given!" while the build
      # still reports success, which would otherwise read as a pass.
      - name: Verify GameTest results
        run: |
          if grep -q "No test functions were given" run/logs/latest.log; then
            echo "::error::GameTest server collected zero tests (namespace gating or a missing @GameTestHolder)"
            exit 1
          fi
          if ! grep -q "required tests passed" run/logs/latest.log; then
            echo "::error::GameTest server did not report success (boot crash or test failure)"
            tail -n 80 run/logs/latest.log || true
            exit 1
          fi
          grep "required tests passed" run/logs/latest.log

      # A mixin that fails to apply does not fail the run: the affected feature just silently
      # stops working. The Iron's-less profile is exactly where the conditional gating in
      # ArsNSpellsMixinPlugin is load-bearing (ANS-CRIT-001), so assert the log is clean.
      - name: Verify no mixin failures
        run: |
          if grep -qE "Mixin apply failed|MixinTargetAlreadyLoadedException|NoClassDefFoundError" run/logs/latest.log; then
            echo "::error::mixin failures on the Iron's-less profile"
            grep -nE "Mixin apply failed|MixinTargetAlreadyLoadedException|NoClassDefFoundError" run/logs/latest.log | head -n 20
            exit 1
          fi
          echo "no mixin failures"

      - name: Upload GameTest logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gametest-logs
          path: run/logs
