name: CI

on:
  pull_request:
    branches: [main, "release/**", "port/neoforge-1.21.1", "codex/3.3.0-neoforge-audit"]
  push:
    branches: [main, "release/**", "port/neoforge-1.21.1", "codex/3.3.0-neoforge-audit"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Forge build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: forge-${{ runner.os }}-${{ hashFiles('**/*.gradle', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: forge-${{ runner.os }}-
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/forge_gradle
            build/forge
          key: forgegradle-${{ runner.os }}-${{ hashFiles('gradle.properties', 'build.gradle') }}
      - run: chmod +x ./gradlew
      - name: Verify tooling and icon assets
        run: |
          python3 -m unittest discover -s tools -p "test_*.py"
          python3 tools/generate_icons.py --check
          python3 tools/verify_icons.py
      - name: Verify shared domain and golden fixture manifest
        run: python3 tools/contract_parity.py
      - run: ./gradlew compileJava test --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forge-unit-results
          path: |
            build/reports/tests/test
            build/test-results/test

  # The expected counts are pinned to the final 3.3.3 Forge run. The verifier
  # rejects a green ForgeGradle exit that did not complete the requested suite.
  gametest:
    name: Forge GameTests (${{ matrix.profile }})
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: absent
            flags: ""
            executed: 1
            skipped: 84
            identity: "--absent irons_spellbooks --absent ars_elemental --absent ars_zero --absent toomanyglyphs"
          - profile: loaded
            flags: "-PwithIronsRuntimeGameTests -PwithArsElemental"
            executed: 75
            skipped: 10
            identity: "--present irons_spellbooks --present ars_elemental --absent ars_zero --absent toomanyglyphs"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/caches/forge_gradle
            build/forge
          key: forge-${{ runner.os }}-${{ hashFiles('**/*.gradle', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
      - run: chmod +x ./gradlew
      - name: Run isolated profile
        run: ./gradlew runGameTestServer -PgametestRunDir=run-${{ matrix.profile }} ${{ matrix.flags }} --no-daemon --stacktrace
      - name: Verify completed tests and actual runtime profile
        run: >
          python3 tools/verify_gametest_log.py run-${{ matrix.profile }}/logs/latest.log
          --required 115 --executed ${{ matrix.executed }} --skipped ${{ matrix.skipped }} ${{ matrix.identity }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forge-gametest-${{ matrix.profile }}
          path: run-${{ matrix.profile }}/logs

  # Saved-world removal remains informational because Iron's own pocket-dimension
  # registry prevents a world that references it from decoding without Iron's.
  gametest-removal:
    name: Forge saved-world removal (informational)
    runs-on: ubuntu-latest
    needs: build-and-test
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/caches/forge_gradle
            build/forge
          key: forge-${{ runner.os }}-${{ hashFiles('**/*.gradle', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
      - run: chmod +x ./gradlew
      - name: Save a loaded world
        run: ./gradlew runGameTestServer -PwithIronsRuntimeGameTests -PwithArsElemental -PgametestRunDir=run-removal --no-daemon --stacktrace
      - name: Verify loaded preparation
        run: >
          python3 tools/verify_gametest_log.py run-removal/logs/latest.log
          --required 115 --executed 75 --skipped 10
          --present irons_spellbooks --present ars_elemental
          --absent ars_zero --absent toomanyglyphs
      - name: Upload removal preparation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-removal-preparation
          path: run-removal/logs
