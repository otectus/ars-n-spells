modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/otectus/ars-n-spells/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
displayURL = "https://github.com/otectus/ars-n-spells"
updateJSONURL = "https://raw.githubusercontent.com/otectus/ars-n-spells/main/update.json"
authors = "${mod_authors}"
description = '''${mod_description}'''

# Two configs on purpose. Ars Nouveau is a REQUIRED dependency, so a mixin failure there
# means the mod is genuinely broken and should fail loudly. Iron's Spellbooks is OPTIONAL,
# so a conflict in that half must degrade the integration - a warning and one skipped mixin -
# rather than aborting startup for every mod in the chain. That is not hypothetical: a
# @Redirect of ours into a method another mod had overwritten took down twelve mods in a
# user's pack on the 1.20.1 line.
[[mixins]]
    config = "ars_n_spells.mixins.json"

[[mixins]]
    config = "ars_n_spells.compat.mixins.json"

[[dependencies.${mod_id}]]
    modId = "neoforge"
    type = "required"
    versionRange = "${neoforge_version_range}"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "minecraft"
    type = "required"
    versionRange = "${minecraft_version_range}"
    ordering = "NONE"
    side = "BOTH"

# Ars Nouveau is a hard dependency: this mod registers rituals into Ars' own RitualRegistry and
# reads its glyph metadata, so it must load AFTER Ars. The range is floored at the line we
# actually compile against - the 1.20.1 build once shipped a range that silently disagreed with
# the compile classpath (CHANGELOG 3.0.0), and that must not repeat.
[[dependencies.${mod_id}]]
    modId = "ars_nouveau"
    type = "required"
    versionRange = "${ars_nouveau_version_range}"
    ordering = "AFTER"
    side = "BOTH"

# Iron's Spells 'n Spellbooks is OPTIONAL. Without it the mod still loads and plays: mana
# unification falls back to ARS_PRIMARY, the Iron's-gated items and recipes do not register, and
# every Iron's-gated handler and mixin is skipped. Load AFTER it when present so its SpellRegistry
# exists before ArsCrossProxyRegistry contributes the ars_cross_1..8 proxies.
[[dependencies.${mod_id}]]
    modId = "irons_spellbooks"
    type = "optional"
    versionRange = "${irons_spellbooks_version_range}"
    ordering = "AFTER"
    side = "BOTH"

# Ars Nouveau addons ANS is verified against. Both OPTIONAL and never compiled against: their
# glyphs arrive through Ars' GlyphRegistry, which ANS reads lazily, so the AFTER ordering is
# documentary. The ranges are floored at the files the opt-in GameTest profiles actually load.
# Ars Zero 2.0.2 itself requires Ars Elemental.
[[dependencies.${mod_id}]]
    modId = "ars_elemental"
    type = "optional"
    versionRange = "${ars_elemental_version_range}"
    ordering = "AFTER"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "ars_zero"
    type = "optional"
    versionRange = "${ars_zero_version_range}"
    ordering = "AFTER"
    side = "BOTH"
