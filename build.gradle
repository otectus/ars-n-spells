plugins {
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

group = mod_group
version = mod_version
archivesBaseName = mod_id

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

// -PgametestRunDir=<path> gives a run profile its own world folder; the default keeps the
// historical `run/`. The Iron's-absent and Iron's-loaded gametest profiles must never share one:
// a world written by the loaded profile cannot be decoded by the absent one (its dimension types
// are gone with the mod), and `runGameTestServer` still exits 0 / BUILD SUCCESSFUL over the top
// of that failure. Separate directories make each profile a fresh world (audit V26/T0.1).
ext.gametestRunDir = project.findProperty('gametestRunDir') ?: 'run'

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file(gametestRunDir)
            mods {
                ars_n_spells {
                    source sourceSets.main
                }
            }
        }

        client {}
        server { args '--nogui' }

        // 2.0.0: gameTestServer run target for headless gameplay tests
        // (Phase 3.3 of the audit roadmap). Tests live in
        // src/main/java/com/otectus/arsnspells/gametest and are gated on the
        // `ars_n_spells` namespace property so other mods' tests do not run.
        gameTestServer {
            args '--nogui'
            property 'forge.enabledGameTestNamespaces', 'ars_n_spells'
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
        }
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
    }
    // Curios API — compile-only. Curios is always present at runtime (Ars Nouveau
    // hard-depends on it); this only puts the slot-aware API on the compile classpath
    // so EquipmentIntegration can read per-curio attribute modifiers (Apotheosis affixes).
    maven {
        name = 'Illusive Soulworks'
        url = 'https://maven.theillusivec4.top/'
    }
    // GeckoLib — runtime dependency of Ars Nouveau (and Iron's).
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
    }
    // PlayerAnimator — runtime dependency of Iron's Spellbooks.
    maven {
        name = 'KosmX'
        url = 'https://maven.kosmx.dev/'
    }
    // JEI — compile-only API for the optional client-side proxy-recipe filter.
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com/'
    }
    // Ars Zero is not on CurseMaven, so -PwithArsZero reads the jar straight out of
    // libs/. That directory is git-ignored, which makes the profile local-only: the
    // repository is declared only under the property so a clean checkout never sees it.
    if (project.hasProperty('withArsZero')) {
        flatDir { dirs 'libs' }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation fg.deobf("curse.maven:${ars_nouveau_project}:${ars_nouveau_file}")
    compileOnly fg.deobf("curse.maven:${irons_spellbooks_project}:${irons_spellbooks_file}")
    // ANS-3.0.0: opt-in Iron's-loaded GameTest profile. By default Iron's stays
    // compileOnly, so `runGameTestServer` exercises the Iron-LESS fallback path and the
    // Iron-loaded gametests self-skip on IronsCompat.isLoaded()==false. Pass
    // -PwithIronsRuntimeGameTests to also put Iron's on the run classpath so the
    // Iron-loaded cross-cast/export integration scenarios actually execute.
    // Iron's pulls a runtime graph that CurseMaven does not resolve transitively;
    // its extra pieces (PlayerAnimator) ride the same profile flag.
    if (project.hasProperty('withIronsRuntimeGameTests')) {
        runtimeOnly fg.deobf("curse.maven:${irons_spellbooks_project}:${irons_spellbooks_file}")
        runtimeOnly fg.deobf("dev.kosmx.player-anim:player-animation-lib-forge:${playeranimator_version}")
    }
    // Optional Ars Nouveau addon profiles. Runtime-only and opt-in: ANS compiles against
    // neither, and the addon GameTests self-skip when the mod is absent, so the default run
    // is unaffected. Combine freely, e.g.
    //   ./gradlew runGameTestServer -PwithIronsRuntimeGameTests -PwithArsElemental -PwithTooManyGlyphs
    if (project.hasProperty('withArsElemental')) {
        runtimeOnly fg.deobf("curse.maven:${ars_elemental_project}:${ars_elemental_file}")
    }
    if (project.hasProperty('withTooManyGlyphs')) {
        runtimeOnly fg.deobf("curse.maven:${toomanyglyphs_project}:${toomanyglyphs_file}")
    }
    // Ars Zero: local-only profile, resolved from the flatDir repository above against
    // libs/ars_zero-1.20.1-2.0.2HOTFIX.jar. It hard-depends on TerraBlender, which the
    // flatDir coordinate carries no metadata for, so that comes from the Forge maven.
    // Curios 5.14.1 (Ars Zero's floor) is already the runtime version, see step above.
    // Combines with -PwithArsElemental — Ars Zero ships its own ArsElementalCompat.
    if (project.hasProperty('withArsZero')) {
        runtimeOnly fg.deobf("blank:ars_zero-1.20.1:2.0.2HOTFIX")
        runtimeOnly fg.deobf("com.github.glitchfiend:TerraBlender-forge:${terrablender_version}")
    }
    // Covenant of the Seven has no runtime profile: its own hard deps (Blood Magic,
    // Enigmatic Legacy, Nature's Aura, Iron's, Curios 5.14) are not resolvable here.
    // Its surface is verified against the jar by CovenantJarSurfaceTest instead.
    // Curios API only (matches the version Ars Nouveau bundles at runtime).
    compileOnly fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}:api")
    // JEI API, compile-only. ANS never requires JEI: the plugin class is annotated
    // @JeiPlugin and is simply never loaded when JEI is absent. Only the API artifacts are
    // pulled — the full jar would drag JEI onto the runtime classpath of every run task.
    compileOnly fg.deobf("mezz.jei:jei-1.20.1-common-api:${jei_version}")
    compileOnly fg.deobf("mezz.jei:jei-1.20.1-forge-api:${jei_version}")
    // Ars Nouveau's own runtime graph (Curios full jar + GeckoLib) so
    // runClient/runGameTestServer can boot without hand-copied jars.
    runtimeOnly fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}")
    // GeckoLib also compileOnly: it appears in Ars Nouveau's own class signatures
    // (RitualBrazierTile implements GeoBlockEntity), so javac cannot resolve those types
    // without it -- which blocked the ritual GameTests from referencing a brazier at all.
    // Runtime classpath is unchanged; the line below already supplies it there.
    compileOnly fg.deobf("software.bernie.geckolib:geckolib-forge-${minecraft_version}:${geckolib_version}")
    runtimeOnly fg.deobf("software.bernie.geckolib:geckolib-forge-${minecraft_version}:${geckolib_version}")
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
    // ASM, so CovenantJarSurfaceTest can read the Covenant jar's bytecode without
    // classloading it (its dependencies are not on any classpath here).
    testImplementation 'org.ow2.asm:asm:9.5'
    testImplementation 'org.ow2.asm:asm-tree:9.5'
}

test {
    useJUnitPlatform()
}

// The GameTest harness resolves unprefixed templates (e.g. "platform") against
// <run dir>/gameteststructures/*.snbt. Neither vanilla nor Forge ship any, so
// stage the committed ones into the run dir before any game run.
tasks.register('stageGameTestStructures', Copy) {
    from 'src/test/resources/gameteststructures'
    into "${gametestRunDir}/gameteststructures"
}
tasks.matching { it.name in ['runGameTestServer', 'runClient', 'runServer'] }.configureEach {
    dependsOn 'stageGameTestStructures'
}

processResources {
    inputs.property "version", project.version
    filesMatching("META-INF/mods.toml") {
        expand "version": project.version
    }
}

mixin {
    // One refmap per source set; both configs declare the same refmap name so the
    // annotation processor's single output serves them both.
    add sourceSets.main, "ars_n_spells.refmap.json"
    config "ars_n_spells.mixins.json"
    // Iron's/Covenant-targeting mixins live in a separate, non-required config so a
    // conflict with a third-party mixin degrades that one mixin instead of aborting
    // mod loading for the whole pack.
    config "ars_n_spells.compat.mixins.json"
}

jar {
    manifest {
        attributes([
                "Specification-Title": mod_id,
                "Specification-Vendor": mod_authors,
                "Specification-Version": "1",
                "Implementation-Title": project.name,
                "Implementation-Version": project.jar.archiveVersion,
                "Implementation-Vendor": mod_authors,
                "MixinConfigs": "ars_n_spells.mixins.json,ars_n_spells.compat.mixins.json"
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}