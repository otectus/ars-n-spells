plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.144'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

repositories {
    mavenCentral()
    // Ars Nouveau + JEI.
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
        content {
            includeGroup 'com.hollingsworth.ars_nouveau'
            includeGroup 'com.hollingsworth.nuggets'
            includeGroup 'mezz.jei'
            includeGroup 'vazkii.patchouli'
        }
    }
    // Iron's Spells 'n Spellbooks.
    maven {
        name = 'Redspace'
        url = 'https://code.redspace.io/releases'
        content { includeGroup 'io.redspace' }
    }
    // Player Animator - a mods.toml dependency of Iron's Spellbooks, used only by the
    // -PwithIronsRuntimeGameTests profile.
    maven {
        name = 'kosmx'
        url = 'https://maven.kosmx.dev/'
        content { includeGroup 'dev.kosmx.player-anim' }
    }
    // Curios API (also a transitive runtime dep of Ars Nouveau).
    maven {
        name = 'Illusive Soulworks'
        url = 'https://maven.theillusivec4.top/'
        content { includeGroup 'top.theillusivec4.curios' }
    }
    // GeckoLib - transitive runtime dep of Ars Nouveau.
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content { includeGroup 'software.bernie.geckolib' }
    }
    // TerraBlender - transitive runtime dep of Ars Nouveau. Served from the MinecraftForge
    // maven, NOT from maven.glitchfiend.net: that host no longer resolves in DNS, and Ars'
    // POM names it, so leaving it as the only source breaks `test` and every run task.
    maven {
        name = 'MinecraftForge'
        url = 'https://maven.minecraftforge.net'
        content { includeGroup 'com.github.glitchfiend' }
    }
    // CurseMaven: required for two of Ars Nouveau's own transitive runtime deps (Jade,
    // Infiniverse), which its POM declares with curse.maven coordinates, and for the
    // opt-in Ars Elemental test profile.
    maven {
        name = 'Curse Maven'
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
}

// Game directory for runGameTestServer. Overridable per profile so the absent and loaded runs
// never reuse each other's saved world; see the gameTestServer run block below.
def gametestRunDir = project.findProperty('gametestRunDir') ?: 'run'

neoForge {
    version = neoforge_version

    if (parchment_version?.trim() && parchment_mc_version?.trim()) {
        parchment {
            mappingsVersion = parchment_version
            minecraftVersion = parchment_mc_version
        }
    }

    runs {
        configureEach {
            logLevel = org.slf4j.event.Level.DEBUG
        }
        client {
            client()
            gameDirectory = project.file('run')
            programArguments.addAll '--username', 'Dev'
        }
        server {
            server()
            gameDirectory = project.file('run-server')
            programArgument '--nogui'
        }
        // Headless gameplay tests. Namespace-gated so other mods' GameTests do not run.
        //
        // -PgametestRunDir picks the game directory (default 'run', the historical behaviour).
        // The absent and loaded profiles MUST NOT share one: the loaded profile writes a world
        // whose chunks reference irons_spellbooks registry entries, and re-opening it without
        // Iron's fails to decode while Gradle still prints BUILD SUCCESSFUL - a green run over
        // a server that never started. CI passes a distinct directory per profile.
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = project.file(gametestRunDir)
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        data {
            data()
            gameDirectory = project.file('run-data')
            programArguments.addAll(
                '--mod', mod_id,
                '--all',
                '--output', file('src/generated/resources/').absolutePath,
                '--existing', file('src/main/resources/').absolutePath
            )
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }

    // Puts Minecraft + NeoForge on the JUnit classpath. Replaces the hand-rolled
    // `sourceSets.test.compileClasspath += sourceSets.main.compileClasspath` hack this project
    // carried before: several tests touch net.minecraft.* and com.mojang.serialization.*.
    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }
}

dependencies {
    // Ars Nouveau - hard dependency. Transitives are deliberately left ON so the dev runs get
    // Ars' real runtime graph (GeckoLib, Curios, Nuggets, Patchouli, JEI, TerraBlender, Jade,
    // Infiniverse) and `runClient` boots a genuine Ars install.
    implementation "com.hollingsworth.ars_nouveau:ars_nouveau-${minecraft_version}:${ars_nouveau_version}"

    // Iron's Spells 'n Spellbooks - OPTIONAL, compileOnly by design. Keeping it off the default
    // run classpath is what makes `runGameTestServer` exercise the Iron's-LESS fallback path;
    // the Iron's-loaded GameTests self-skip on IronsCompat.isLoaded()==false. Pass
    // -PwithIronsRuntimeGameTests to also put Iron's on the run classpath.
    //
    // Iron's declares three mods.toml dependencies that its POM does not, so adding only
    // irons_spellbooks leaves mod loading refusing to start. All three are wired below.
    // `playeranimator` is the awkward one: kosmx's maven publishes only the common/Fabric/Forge
    // library variants and the jar named there carries no mods.toml at all, so it never supplies
    // the `playeranimator` modid Iron's asks for. The NeoForge build exists only on CurseForge,
    // so it is pulled by coordinate like the Ars addon profiles below.
    compileOnly "io.redspace:irons_spellbooks:${irons_spellbooks_version}"
    if (project.hasProperty('withIronsRuntimeGameTests')) {
        runtimeOnly "io.redspace:irons_spellbooks:${irons_spellbooks_version}"
        // Iron's own mods.toml dependencies. The jar's POM does not declare them, so adding
        // only irons_spellbooks left mod loading refusing to start with three "requires ..."
        // errors - which is why this profile had never actually run.
        //
        // transitive = false on all three: these are published for multiple loaders and their
        // POMs name Fabric artifacts (player-animation-lib pulls fabric-loader), which do not
        // resolve here and are not wanted on a NeoForge run classpath anyway.
        runtimeOnly("io.redspace:irons_lib:${irons_lib_version}") { transitive = false }
        // CurseForge, not kosmx's maven: only the CurseForge NeoForge build carries the
        // neoforge.mods.toml that registers the `playeranimator` modid. The file id below is
        // player-animation-lib-forge-${player_animation_version}.jar ("forge" is NeoForge on
        // this MC line); the version it resolves to must stay >= what Iron's requires.
        runtimeOnly "curse.maven:player-animator-${player_animator_project}:${player_animator_file}"
        // Ars Nouveau pins GeckoLib 4.6.6; Iron's requires 4.7.5.1 or above. 4.7.5.1 is the
        // lowest version that satisfies Iron's, so it is the smallest possible step away from
        // what Ars was tested against.
        runtimeOnly("software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_runtime_version}") {
            transitive = false
        }
    }

    // GeckoLib also compileOnly: it appears in Ars Nouveau's own class signatures
    // (RitualBrazierTile implements GeoBlockEntity), so javac cannot resolve those types
    // without it, which blocked the ritual GameTests from referencing a brazier at all.
    // Runtime classpath is unchanged; the runtimeOnly line above already supplies it there.
    compileOnly("software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_runtime_version}") {
        transitive = false
    }

    // Curios API only (Ars pulls the full jar transitively at runtime).
    compileOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}"

    // JEI API, compile-only. The full jar arrives transitively via Ars at runtime.
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"

    // Optional Ars Nouveau addon profiles. Runtime-only and opt-in: ANS compiles against them in
    // no way, and the addon GameTests self-skip when the mod is absent. Ars Zero 2.0.2 declares
    // Ars Elemental as a required dependency, so the Zero profile implies the Elemental one.
    if (project.hasProperty('withArsElemental') || project.hasProperty('withArsZero')
            || project.hasProperty('withArsElemancy')) {
        runtimeOnly "curse.maven:ars-elemental-${ars_elemental_project}:${ars_elemental_file}"
    }
    if (project.hasProperty('withArsZero')) {
        runtimeOnly "curse.maven:ars-zero-${ars_zero_project}:${ars_zero_file}"
    }
    if (project.hasProperty('withArsElemancy')) {
        runtimeOnly "curse.maven:ars-elemancy-${ars_elemancy_project}:${ars_elemancy_file}"
    }

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    // ModDevGradle's unitTest harness runs the tests from build/minecraft-junit so the
    // Minecraft bootstrap has a game directory. Several tests are structural - they read the
    // resource tree and the registrar sources to assert invariants a compiler cannot - so they
    // need the project root, not the harness's working directory. Hand it over explicitly
    // rather than overriding workingDir, which the harness owns.
    systemProperty 'ans.projectDir', projectDir.absolutePath
}

// The GameTest harness resolves unprefixed templates (e.g. "platform") against
// <run dir>/gameteststructures/*.snbt. Neither vanilla nor NeoForge ship any, so stage the
// committed ones into the run dir before any game run.
tasks.register('stageGameTestStructures', Copy) {
    from 'src/test/resources/gameteststructures'
    into "${gametestRunDir}/gameteststructures"
}
// runClient uses 'run' unconditionally, so stage into both when a profile moved the gametest
// directory elsewhere. Cheap: it is four small .snbt files.
tasks.register('stageGameTestStructuresDefault', Copy) {
    from 'src/test/resources/gameteststructures'
    into 'run/gameteststructures'
}
tasks.matching { it.name in ['runGameTestServer', 'runClient', 'runServer'] }.configureEach {
    dependsOn 'stageGameTestStructures', 'stageGameTestStructuresDefault'
}

processResources {
    def replaceProps = [
        minecraft_version             : minecraft_version,
        minecraft_version_range       : minecraft_version_range,
        neoforge_version              : neoforge_version,
        neoforge_version_range        : neoforge_version_range,
        loader_version_range          : loader_version_range,
        ars_nouveau_version_range     : ars_nouveau_version_range,
        irons_spellbooks_version_range: irons_spellbooks_version_range,
        ars_elemental_version_range   : ars_elemental_version_range,
        ars_zero_version_range        : ars_zero_version_range,
        ars_elemancy_version_range    : ars_elemancy_version_range,
        mod_id                        : mod_id,
        mod_name                      : mod_name,
        mod_license                   : mod_license,
        mod_version                   : mod_version,
        mod_authors                   : mod_authors,
        mod_description               : mod_description,
    ]
    inputs.properties replaceProps
    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProps
    }
}

jar {
    manifest {
        attributes(
            'Specification-Title'    : mod_id,
            'Specification-Vendor'   : mod_authors,
            'Specification-Version'  : '1',
            'Implementation-Title'   : project.name,
            'Implementation-Version' : project.jar.archiveVersion,
            'Implementation-Vendor'  : mod_authors
        )
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}
